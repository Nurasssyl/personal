<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Где живут туристы — Казахстан 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500&family=Fraunces:ital,wght@0,300;0,700;1,300;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<style>
:root {
  --ink: #0a0a0a;
  --cream: #f5f0e8;
  --rust: #c84b2f;
  --gold: #d4a843;
  --teal: #1a6b6b;
  --ff-d: 'Bebas Neue', sans-serif;
  --ff-s: 'DM Serif Display', serif;
  --ff-b: 'Fraunces', serif;
  --ff-m: 'IBM Plex Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--ink); color: var(--cream); font-family: var(--ff-b); font-weight: 300; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E"); pointer-events: none; z-index: 9998; }

/* PROGRESS */
#progress-bar { position: fixed; top: 0; left: 0; height: 2px; background: var(--rust); width: 0%; z-index: 9999; }

/* LANGUAGE SWITCHER */
#lang-switcher { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; gap: 4px; }
.lang-btn { font-family: var(--ff-m); font-size: 9px; letter-spacing: 2px; padding: 6px 12px; border: 1px solid rgba(245,240,232,0.2); background: transparent; color: rgba(245,240,232,0.4); cursor: pointer; transition: all 0.25s; text-transform: uppercase; }
.lang-btn.active { background: var(--rust); border-color: var(--rust); color: var(--cream); }
.lang-btn:hover:not(.active) { border-color: rgba(245,240,232,0.4); color: rgba(245,240,232,0.7); }

/* SIDE NAV */
#side-nav { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); z-index: 100; display: flex; flex-direction: column; gap: 7px; }
.nav-dot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid rgba(245,240,232,0.3); cursor: pointer; transition: all 0.3s; }
.nav-dot.active { background: var(--rust); border-color: var(--rust); transform: scale(1.5); }

/* TOOLTIP */
#tooltip { position: fixed; background: rgba(6,6,6,0.97); border: 1px solid rgba(245,240,232,0.1); padding: 10px 14px; font-family: var(--ff-m); font-size: 11px; color: var(--cream); pointer-events: none; z-index: 9999; opacity: 0; transition: opacity 0.15s; max-width: 260px; line-height: 1.65; }

/* SECTIONS */
section { position: relative; min-height: 100vh; padding: 90px 8vw; overflow: hidden; }
#hero { display: flex; flex-direction: column; justify-content: center; padding: 0 8vw; min-height: 100vh; }

/* HERO */
.hero-kicker { font-family: var(--ff-m); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--rust); margin-bottom: 22px; opacity: 0; }
.hero-title { font-family: var(--ff-d); font-size: clamp(4rem, 13vw, 16rem); line-height: 0.87; color: var(--cream); opacity: 0; letter-spacing: -2px; }
.hero-title em { font-style: normal; color: var(--rust); }
.hero-sub { font-family: var(--ff-s); font-size: clamp(0.9rem, 2vw, 1.4rem); font-style: italic; color: rgba(245,240,232,0.5); margin-top: 28px; max-width: 560px; opacity: 0; line-height: 1.55; }
.hero-stats-row { display: flex; gap: 36px; margin-top: 52px; flex-wrap: wrap; opacity: 0; }
.hero-stat { border-left: 2px solid var(--rust); padding-left: 14px; }
.hero-stat .num { font-family: var(--ff-d); font-size: 2.4rem; color: var(--cream); line-height: 1; }
.hero-stat .lbl { font-family: var(--ff-m); font-size: 8px; color: rgba(245,240,232,0.35); text-transform: uppercase; letter-spacing: 2px; margin-top: 3px; }
.hero-scroll { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 7px; opacity: 0; }
.hero-scroll span { font-family: var(--ff-m); font-size: 8px; letter-spacing: 3px; color: rgba(245,240,232,0.22); text-transform: uppercase; }
.scroll-line { width: 1px; height: 52px; background: linear-gradient(to bottom, rgba(245,240,232,0.22), transparent); animation: scrl 2s ease-in-out infinite; }
@keyframes scrl { 0%{transform:scaleY(0);transform-origin:top} 50%{transform:scaleY(1);transform-origin:top} 51%{transform:scaleY(1);transform-origin:bottom} 100%{transform:scaleY(0);transform-origin:bottom} }

/* SECTION PARTS */
.sl { font-family: var(--ff-m); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--rust); opacity: 0.85; display: block; }
.sh { font-family: var(--ff-d); font-size: clamp(2.4rem, 5vw, 6rem); line-height: 0.9; color: var(--cream); letter-spacing: -1px; margin-top: 10px; }
.sb { font-family: var(--ff-b); font-size: 0.97rem; line-height: 1.82; color: rgba(245,240,232,0.68); max-width: 520px; font-weight: 300; }
.div { width: 32px; height: 2px; background: var(--rust); margin: 18px 0; }
.hn { font-family: var(--ff-d); font-size: 1.35em; color: var(--rust); }

/* TWO COL LAYOUT */
.two-col { display: grid; grid-template-columns: 1fr 1.55fr; gap: 64px; align-items: start; margin-top: 48px; }
.text-col { display: flex; flex-direction: column; gap: 18px; }

/* COUNTER */
.counter-block { margin-top: 32px; }
.c-item { display: flex; align-items: baseline; gap: 10px; padding: 16px 0; border-bottom: 1px solid rgba(245,240,232,0.07); }
.c-item:first-child { border-top: 1px solid rgba(245,240,232,0.07); }
.c-num { font-family: var(--ff-d); font-size: 2.8rem; color: var(--cream); min-width: 130px; }
.c-lbl { font-family: var(--ff-b); font-size: 0.82rem; color: rgba(245,240,232,0.4); line-height: 1.4; }

/* TYPE BARS */
.tb-row { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.tb-name { font-family: var(--ff-m); font-size: 8px; color: rgba(245,240,232,0.5); width: 185px; flex-shrink: 0; text-align: right; line-height: 1.3; }
.tb-wrap { flex: 1; height: 24px; background: rgba(245,240,232,0.035); position: relative; overflow: hidden; }
.tb-bar { height: 100%; background: var(--rust); width: 0; transition: width 1.2s cubic-bezier(.4,0,.2,1); }
.tb-val { font-family: var(--ff-m); font-size: 8px; color: rgba(245,240,232,0.3); position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }

/* BUBBLE */
#bubble-wrap { width: 100%; height: 560px; margin-top: 44px; }

/* S3 DONUT - FIXED LAYOUT */
#s3-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; margin-top: 48px; }
#donut-outer { position: relative; width: 100%; max-width: 380px; margin: 0 auto; }
#donut-outer svg { display: block; width: 100%; }
#donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
#donut-center .dc-n { font-family: var(--ff-d); font-size: 2.4rem; color: var(--cream); line-height: 1; }
#donut-center .dc-l { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.3); text-transform: uppercase; letter-spacing: 2px; }
.leg-item { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid rgba(245,240,232,0.05); }
.leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.leg-name { font-family: var(--ff-b); font-size: 0.8rem; color: rgba(245,240,232,0.6); flex: 1; }
.leg-pct { font-family: var(--ff-m); font-size: 0.8rem; color: var(--gold); }

/* OCC GRID */
#occ-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 48px; }
.occ-cell { aspect-ratio: 1; position: relative; overflow: hidden; cursor: pointer; transition: transform 0.28s; }
.occ-cell:hover { transform: scale(1.05); z-index: 2; }
.occ-bg { position: absolute; inset: 0; }
.occ-in { position: absolute; inset: 0; padding: 10px 9px; display: flex; flex-direction: column; justify-content: space-between; }
.occ-reg { font-family: var(--ff-m); font-size: 7px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.6); line-height: 1.3; }
.occ-pct { font-family: var(--ff-d); font-size: 1.7rem; color: #fff; line-height: 1; }
.occ-sub { font-family: var(--ff-m); font-size: 6px; color: rgba(255,255,255,0.35); letter-spacing: 1px; }

/* MAP */
#s5 { background: #060b0e; }
#map-wrap { margin-top: 44px; width: 100%; }
#world-map { width: 100%; display: block; }
.cpath { stroke: #0a0a0a; stroke-width: 0.35; cursor: pointer; }
.cpath.hd { transition: fill 0.15s; }
.cpath.hd:hover { opacity: 0.75; }
#top-grid { margin-top: 24px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.tc-card { background: rgba(245,240,232,0.028); border: 1px solid rgba(245,240,232,0.06); padding: 10px 8px; text-align: center; }
.tc-flag { font-size: 1.3rem; display: block; margin-bottom: 3px; }
.tc-name { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.4); letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
.tc-val { font-family: var(--ff-d); font-size: 1rem; color: var(--cream); display: block; }
.map-scale { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.map-grad { width: 160px; height: 6px; }
.map-labels { display: flex; justify-content: space-between; width: 160px; }
.map-lbl { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.3); }

/* GENDER */
#gender-rows { margin-top: 16px; }
.g-legend { display: flex; gap: 24px; margin-bottom: 18px; }
.gl-i { display: flex; align-items: center; gap: 7px; }
.gl-dot { width: 10px; height: 10px; }
.gl-lbl { font-family: var(--ff-m); font-size: 8px; letter-spacing: 1px; color: rgba(245,240,232,0.4); }
.g-row { display: grid; grid-template-columns: 140px 1fr 1fr 48px; gap: 3px; align-items: center; margin-bottom: 4px; opacity: 0; }
.g-lbl { font-family: var(--ff-m); font-size: 7px; text-transform: uppercase; letter-spacing: 0.8px; color: rgba(245,240,232,0.4); text-align: right; padding-right: 8px; }
.g-fw { display: flex; justify-content: flex-end; }
.g-mw { display: flex; justify-content: flex-start; }
.g-bar { height: 18px; width: 0; transition: width 1s ease; }
.g-f { background: #4a7a78; }
.g-m { background: var(--rust); }
.g-pct { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.28); text-align: center; }

/* RESORT */
#resort-chart { margin-top: 48px; }
.rc { display: flex; border: 1px solid rgba(245,240,232,0.065); margin-bottom: 2px; overflow: hidden; cursor: default; transition: border-color 0.28s; opacity: 0; transform: translateY(14px); }
.rc:hover { border-color: rgba(200,75,47,0.4); }
.rc-rank { font-family: var(--ff-d); font-size: 2.2rem; color: rgba(245,240,232,0.04); padding: 16px 18px; width: 65px; display: flex; align-items: center; background: rgba(245,240,232,0.01); flex-shrink: 0; }
.rc-info { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; }
.rc-name { font-family: var(--ff-s); font-size: 0.92rem; color: var(--cream); margin-bottom: 5px; }
.rc-bw { height: 3px; background: rgba(245,240,232,0.04); }
.rc-b { height: 100%; background: var(--teal); width: 0; transition: width 1.2s ease; }
.rc-v { font-family: var(--ff-m); font-size: 0.7rem; color: var(--gold); padding: 12px 16px 12px 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; min-width: 100px; }
.rv-n { font-size: 0.95rem; }
.rv-l { font-size: 7px; color: rgba(245,240,232,0.22); letter-spacing: 1px; text-transform: uppercase; }
.rc-occ { padding: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 60px; border-left: 1px solid rgba(245,240,232,0.04); }
.ro-n { font-family: var(--ff-d); font-size: 1.2rem; color: var(--cream); }
.ro-l { font-family: var(--ff-m); font-size: 6px; color: rgba(245,240,232,0.22); letter-spacing: 1px; }

/* PURPOSE */
#purpose-chart { margin-top: 48px; width: 100%; }

/* STAY */
#stay-chart { margin-top: 48px; width: 100%; }

/* STARS */
#stars-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; margin-top: 48px; }
.sc { border: 1px solid rgba(245,240,232,0.065); padding: 26px; opacity: 0; transform: translateY(22px); }
.sc-star { font-family: var(--ff-d); font-size: 1.4rem; color: var(--gold); margin-bottom: 4px; }
.sc-cnt { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.22); letter-spacing: 2px; margin-bottom: 18px; }
.sc-met { margin-bottom: 12px; }
.sc-ml { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
.sc-bw { height: 5px; background: rgba(245,240,232,0.04); }
.sc-b { height: 100%; width: 0; transition: width 1.5s ease; }
.sc-v { font-family: var(--ff-d); font-size: 1.2rem; color: var(--cream); margin-top: 3px; }

/* URBAN */
#urban-chart { margin-top: 48px; }
.ur-row { display: grid; grid-template-columns: 145px 1fr 36px; gap: 9px; align-items: center; margin-bottom: 7px; opacity: 0; }
.ur-lbl { font-family: var(--ff-m); font-size: 7px; text-transform: uppercase; letter-spacing: 0.8px; color: rgba(245,240,232,0.4); text-align: right; }
.ur-w { position: relative; height: 20px; background: rgba(245,240,232,0.03); overflow: hidden; }
.ur-c { position: absolute; left: 0; top: 0; bottom: 0; background: var(--rust); opacity: 0.72; width: 0; transition: width 1.2s ease; }
.ur-r { position: absolute; right: 0; top: 0; bottom: 0; background: var(--teal); opacity: 0.62; width: 0; transition: width 1.2s ease; }
.ur-pct { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.26); text-align: right; }

/* IFO */
#ifo-chart { margin-top: 48px; width: 100%; }

/* BIZ */
#biz-viz { margin-top: 48px; display: grid; grid-template-columns: repeat(2,1fr); gap: 48px; }
.bz-blk { opacity: 0; }
.bz-nm { font-family: var(--ff-s); font-style: italic; font-size: 1.2rem; color: var(--cream); margin-bottom: 12px; }
.bz-pw { display: flex; align-items: center; gap: 18px; }
.bz-st { display: flex; flex-direction: column; gap: 7px; }
.bs-i { display: flex; align-items: center; gap: 7px; }
.bs-d { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.bs-l { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.32); letter-spacing: 1px; }
.bs-v { font-family: var(--ff-d); font-size: 0.9rem; color: var(--cream); }

/* REV SCATTER */
#rev-scatter { margin-top: 48px; width: 100%; }

/* CLUSTER */
.cstat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; margin-top: 48px; }
.cstat { background: rgba(245,240,232,0.022); padding: 28px 22px; border: 1px solid rgba(245,240,232,0.045); opacity: 0; transform: translateY(14px); }
.cs-n { font-family: var(--ff-d); font-size: clamp(2rem,3.2vw,3.6rem); color: var(--cream); line-height: 1; }
.cs-l { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.28); letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }
.cs-s { font-family: var(--ff-b); font-size: 0.75rem; color: rgba(245,240,232,0.32); margin-top: 3px; }

/* ROOM */
#room-chart { margin-top: 48px; display: flex; flex-direction: column; gap: 8px; }

/* PRICE */
#price-chart { margin-top: 48px; width: 100%; }

/* CHILDREN */
#child-inner { display: grid; grid-template-columns: 280px 1fr; gap: 56px; margin-top: 48px; align-items: center; }
.child-stat { margin-bottom: 20px; }
.chi-l { font-family: var(--ff-m); font-size: 7px; color: rgba(245,240,232,0.32); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2px; }
.chi-n { font-family: var(--ff-d); font-size: 3.2rem; color: var(--cream); line-height: 1; }

/* CONCLUSION */
#concl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; margin-top: 64px; }
.conc-blk { border-top: 2px solid rgba(245,240,232,0.1); padding-top: 18px; opacity: 0; }
.conc-n { font-family: var(--ff-d); font-size: 3.2rem; color: var(--rust); }
.conc-t { font-family: var(--ff-b); font-size: 0.92rem; color: rgba(245,240,232,0.52); line-height: 1.7; margin-top: 6px; }

/* BACK HOME */
#back-home { display: block; text-align: center; margin: 68px auto 0; width: fit-content; padding: 15px 42px; border: 1px solid rgba(245,240,232,0.18); font-family: var(--ff-m); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--cream); text-decoration: none; transition: all 0.3s; position: relative; overflow: hidden; }
#back-home::before { content: ''; position: absolute; inset: 0; background: var(--rust); transform: translateX(-100%); transition: transform 0.4s cubic-bezier(.4,0,.2,1); }
#back-home:hover::before { transform: translateX(0); }
#back-home span { position: relative; z-index: 1; }

footer { text-align: center; padding: 32px; font-family: var(--ff-m); font-size: 8px; color: rgba(245,240,232,0.16); letter-spacing: 2px; border-top: 1px solid rgba(245,240,232,0.04); line-height: 1.8; }
footer a { color: var(--rust); text-decoration: none; }

/* BG VARIANTS */
#s2  { background: #0c0c0c; }
#s3  { background: var(--ink); }
#s4  { background: #0d0d0d; }
#s6  { background: #0b1210; }
#s7  { background: var(--ink); }
#s8  { background: #0a0c10; }
#s9  { background: var(--ink); }
#s10 { background: #0f0c08; }
#s11 { background: #050505; }
#s12 { background: var(--ink); }
#s13 { background: #080f0a; }
#s14 { background: var(--ink); }
#s15 { background: #08090e; }
#s16 { background: var(--ink); }
#s17 { background: #0d0a0f; }
#s18 { background: var(--ink); }
#s19 { background: #050d0a; }
#s20 { background: var(--ink); }

@media(max-width:880px){
  .two-col,#s3-inner,#concl-grid,#biz-viz,#child-inner{grid-template-columns:1fr;}
  #occ-grid{grid-template-columns:repeat(4,1fr);}
  #stars-grid{grid-template-columns:1fr 1fr;}
  .cstat-grid{grid-template-columns:1fr 1fr;}
  #side-nav,#top-grid{display:none;}
}
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="tooltip"></div>

<!-- LANGUAGE SWITCHER -->
<div id="lang-switcher">
  <button class="lang-btn active" onclick="setLang('ru')">РУС</button>
  <button class="lang-btn" onclick="setLang('kz')">ҚАЗ</button>
  <button class="lang-btn" onclick="setLang('en')">ENG</button>
</div>

<!-- SIDE NAV -->
<nav id="side-nav">
  <div class="nav-dot active" data-s="hero"></div>
  <div class="nav-dot" data-s="s1"></div>
  <div class="nav-dot" data-s="s2"></div>
  <div class="nav-dot" data-s="s3"></div>
  <div class="nav-dot" data-s="s4"></div>
  <div class="nav-dot" data-s="s5"></div>
  <div class="nav-dot" data-s="s6"></div>
  <div class="nav-dot" data-s="s7"></div>
  <div class="nav-dot" data-s="s8"></div>
  <div class="nav-dot" data-s="s9"></div>
  <div class="nav-dot" data-s="s10"></div>
  <div class="nav-dot" data-s="s11"></div>
  <div class="nav-dot" data-s="s12"></div>
  <div class="nav-dot" data-s="s13"></div>
  <div class="nav-dot" data-s="s14"></div>
  <div class="nav-dot" data-s="s15"></div>
  <div class="nav-dot" data-s="s16"></div>
  <div class="nav-dot" data-s="s17"></div>
  <div class="nav-dot" data-s="s18"></div>
  <div class="nav-dot" data-s="s19"></div>
  <div class="nav-dot" data-s="s20"></div>
</nav>

<!-- ══ HERO ══ -->
<section id="hero">
  <div class="hero-kicker" data-i18n="hero.kicker"></div>
  <h1 class="hero-title" data-i18n="hero.title"></h1>
  <p class="hero-sub" data-i18n="hero.sub"></p>

const tip = document.getElementById('tooltip');
function showTip(html,e){tip.innerHTML=html;tip.style.opacity=1;tip.style.left=(e.clientX+16)+'px';tip.style.top=(e.clientY-20)+'px';}

// Nav dots
const SIDS=['hero','s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12','s13','s14','s15','s16','s17','s18','s19','s20'];
const dots=document.querySelectorAll('.nav-dot');
dots.forEach((d,i)=>d.addEventListener('click',()=>document.getElementById(SIDS[i]).scrollIntoView({behavior:'smooth'})));
new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const i=SIDS.indexOf(e.target.id);dots.forEach(d=>d.classList.remove('active'));if(i>=0)dots[i].classList.add('active');}}),{threshold:0.3}).observe;
SIDS.forEach(id=>{const el=document.getElementById(id);if(el)new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const i=SIDS.indexOf(e.target.id);dots.forEach(d=>d.classList.remove('active'));if(i>=0)dots[i].classList.add('active');}}),{threshold:0.3}).observe(el);});

function rebuildTypeChart(){
  const c=document.getElementById('type-chart');
  if(!c) return;
  c.innerHTML='';
  const max=BY_TYPE[0].visitors;
  BY_TYPE.forEach(d=>{

}

// ═══════ S5 WORLD MAP ═══════
(()=>{
  const valByISO3={};
  // Greenland (304→DNK) and Western Sahara (732→MAR) are mapped in NUM2A3
  // so their fills will automatically inherit parent country colors
  Object.entries(NATIONS_ALL).forEach(([name,val])=>{const iso=RU2ISO[name];if(iso){valByISO3[iso]=(valByISO3[iso]||0)+val;}});
  const maxVal=Math.max(...Object.values(valByISO3));
  const col=d3.scaleLog().domain([1,maxVal]).range(['#1a7a4a','#c84b2f']).clamp(true);

  // Top 10
  const iso3ByRu={};Object.entries(RU2ISO).forEach(([ru,iso])=>iso3ByRu[iso]=ru);
  const sorted=Object.entries(valByISO3).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const tg=document.getElementById('top-grid');
  sorted.forEach(([iso,val])=>{
    tg.innerHTML+=`<div class="tc-card"><span class="tc-flag">${FLAGS[iso]||'🌍'}</span><span class="tc-name">${iso}</span><span class="tc-val">${fmt(val)}</span></div>`;
  });

  const mw=document.getElementById('map-wrap');
  const W=mw.offsetWidth||900;const H=Math.round(W*0.50);
  const svg=d3.select('#world-map').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%');
  const proj=d3.geoNaturalEarth1().scale(W/6.1).translate([W/2,H/2]);
  const path=d3.geoPath().projection(proj);

  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json()).then(world=>{
    const countries=topojson.feature(world,world.objects.countries);
    svg.selectAll('.cpath').data(countries.features).join('path')
      .attr('class', d => {
        const a3=NUM2A3[String(d.id).padStart(3,'0')];
        return 'cpath'+(a3&&valByISO3[a3]?' hd':'');
      })
      .attr('d', path)
      .style('fill', d => {
        const a3=NUM2A3[String(d.id).padStart(3,'0')];
        if(a3==='KAZ') return '#d4a843';
        if(a3&&valByISO3[a3]) return col(valByISO3[a3]);
        return '#252525';
      })
      .attr('stroke','#080808').attr('stroke-width',0.35)
    .on('mousemove',(e,d)=>{
      const numId=String(d.id).padStart(3,'0');
      const a3=NUM2A3[numId];
      if(a3==='KAZ'){showTip('🇰🇿 Kazakhstan / Казахстан<br>Host country / Принимающая страна',e);return;}
      if(numId==='304'){showTip('<b>Гренландия</b><br>Административная территория Дании<br>Включено в данные по Дании',e);return;}
      if(numId==='732'){showTip('<b>Западная Сахара</b><br>Контролируется Марокко<br>Включено в данные по Марокко',e);return;}
      const ruNm=iso3ByRu[a3];
      const val=valByISO3[a3];
      if(val) showTip(`<b>${ruNm||a3}</b><br>${fmt(val)} гостей / visitors`,e);
      else showTip(`${ruNm||a3||'—'}<br>Нет данных / No data`,e);
    }).on('mouseleave',hideTip);
  }).catch(()=>{
    svg.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle').attr('font-family','IBM Plex Mono').attr('font-size','11px').attr('fill','rgba(245,240,232,0.25)').text('Загрузка карты...');
  });
})();
