  kpi:['Средняя зарплата','Медианная зарплата','Модальная зарплата','Реальный индекс','Гендерный разрыв','Разрыв регионов'],
  sections:[
   ['§ 01 · КЛЮЧЕВЫЕ ЧИСЛА','Средняя зарплата — только верхний слой картины. Я смотрю рядом медианную и модальную зарплату, чтобы показать не только рост, но и реальное распределение доходов.','Главный сигнал: средняя зарплата выглядит сильнее, чем зарплата большинства. Поэтому дальше смотрим не только на рост, но и на структуру.'],
   ['§ 02 · ТЕНГЕ ПРОТИВ ПОКУПАТЕЛЬНОЙ СИЛЫ','Красная линия — сколько тенге платили в среднем. Синяя — сколько эта зарплата стоит в ценах 2007 года. Обе линии стартуют с одной точки: 52 437 тенге.','График читается просто: чем дальше красная линия от синей, тем больше роста было съедено инфляцией и девальвациями.'],
   ['§ 03 · ЦЕНА ИНФЛЯЦИИ','Этот блок переводит инфляцию на простой язык: какая часть роста зарплаты осталась в покупательной силе, а какая ушла в рост цен.','Выбор года показывает, что номинальный рост и реальное благосостояние — разные вещи. В 2025 году разрыв снова стал заметным.'],
   ['§ 04 · 2025 ПО КВАРТАЛАМ','После годовой линии я перехожу к квартальному срезу по отраслям. Здесь видно, где конец года дал бонусный всплеск, а где рост был слабее.','Тепловая карта показывает уровень зарплат: темнее цвет — выше зарплата. Финансы, IT и добыча держатся наверху почти во всех кварталах.'],
   ['§ 05 · ОТРАСЛЕВАЯ ЛЕСТНИЦА','Средняя зарплата по стране скрывает огромную разницу между видами деятельности. Одна лестница показывает весь разрыв от самых высоких зарплат до самых низких.','Одна экономика, но разные рынки труда: финансы, IT и добыча находятся на верхних ступенях, а образование, искусство и часть сервисов — заметно ниже.'],
   ['§ 06 · РЕГИОНАЛЬНАЯ КАРТА','На карте видно, где зарплатная география Казахстана уходит вверх, а где остается ниже средней планки.','Запад и города-миллионники формируют верхний слой зарплатной географии. Юг и часть северных регионов остаются ниже среднего уровня.'],
   ['§ 07 · ТРИ ЗАРПЛАТЫ','Средняя, медианная и модальная зарплаты движутся не одинаково. Если средняя отрывается от медианной и модальной, распределение становится менее равномерным.','Наведи на точки: видно, что “средний работник” и “средняя зарплата” — не одно и то же. Модальная зарплата остается намного ниже средней.'],
   ['§ 08 · ГЕНДЕРНЫЙ РАЗРЫВ','В этом разрезе видно, насколько женщины зарабатывают меньше мужчин в разных отраслях.','В финансах женщины получают примерно на 28% меньше мужчин. В промышленности и сервисных отраслях разница тоже остается заметной, даже если абсолютные зарплаты разные.'],
   ['§ 09 · РЕАЛЬНЫЙ ИНДЕКС','Каждый столбец показывает, обгоняла ли зарплата инфляцию. Выше 100 — реальный рост, ниже 100 — зарплата не успела за ценами.','Самые слабые места — периоды после валютных шоков и 2025 год. Номинальный рост есть, но реальный индекс уходит ниже 100.'],
   ['§ 10 · РЕГИОНЫ 2025','После карты я раскладываю регионы в одну шкалу. Так легче увидеть, кто выше средней зарплаты по стране, а кто ниже этой линии.','Так лучше видно, насколько отдельные регионы отрываются от страны. Лидеры не просто выше среднего — они формируют отдельный зарплатный пояс.'],
   ['§ 11 · ДВИЖЕНИЕ РАБОЧЕЙ СИЛЫ','Зарплата — только одна сторона рынка труда. Здесь я смотрю движение людей: где прием работников превышал выбытие, а где наоборот.','Зеленое — отрасли с чистым притоком. Красное — сферы, где выбытие превышало прием. Это показывает напряжение рынка труда не хуже зарплат.'],
   ['§ 12 · СТРЕСС РЫНКА ТРУДА','Стресс рынка труда — это неполный день, простой, совместительство, договоры ГПХ и удаленная занятость. Цвет усилен, чтобы матрица читалась сразу.','Образование, госуправление и здравоохранение дают большие числа по нестандартным формам занятости. IT заметно выделяется удаленной работой.'],
   ['§ 13 · ГОРОД И СЕЛО','Дальше — разница внутри отраслей. Один и тот же сектор может платить по-разному в городе и в сельской местности.','Синий вправо — город выше. Красный влево — село выше. Такой разрез показывает внутреннюю неоднородность отраслей.'],
   ['§ 14 · ДОЛЯ МЕДИАНЫ','Этот график отвечает на вопрос: насколько медианная зарплата близка к средней. Чем ниже доля, тем хуже средняя описывает жизнь большинства.','Доля медианы к средней остается заметно ниже 100%. Значит, верхние зарплаты продолжают тянуть среднюю вверх.'],
   ['§ 15 · ГЕНДЕР ВО ВРЕМЕНИ','После отраслей я смотрю динамику во времени: как менялась медианная зарплата мужчин и женщин с 2019 года.','Обе линии растут, но расстояние между ними сохраняется. Рост зарплат сам по себе не закрывает разрыв.'],
   ['§ 16 · НОМИНАЛЬНОЕ И РЕАЛЬНОЕ','Эта полоса показывает годы, когда зарплаты реально обгоняли цены, и годы, когда инфляция была сильнее роста оплаты труда.','Красные годы — моменты, когда рост зарплат был слабее инфляции. Это быстрый способ увидеть, где номинальный рост не стал реальным.'],
   ['§ 17 · ВОЛАТИЛЬНОСТЬ РЕГИОНОВ','У каждого региона в 2025 году был свой квартальный коридор. Линия показывает минимум и максимум, точка — IV квартал.','Чем длиннее линия, тем сильнее зарплата региона менялась внутри года. Это может быть связано с премиями, сезонностью, структурой занятости и долей крупных компаний. Поэтому высокий средний уровень не всегда означает ровную динамику: сырьевые регионы и города чаще дают широкий коридор.'],
   ['§ 18 · РАСПРЕДЕЛЕНИЕ ЗАРПЛАТ','Здесь важно смотреть не на одну цифру, а на форму распределения: где сосредоточена основная масса работников и где находится средняя зарплата.','Если средняя линия стоит правее основной массы столбцов, значит типичная зарплата ниже той цифры, которую чаще всего цитируют в заголовках.'],
   ['§ 19 · НАКОПЛЕННАЯ ЛЕСТНИЦА','Здесь главный элемент — горизонтальный ползунок. Я двигаю порог зарплаты и сразу видно: слева доля людей ниже этого уровня, справа — доля людей выше.','Если большая доля набирается до 300 тысяч тенге, значит, средняя зарплата завышает ощущение “типичного” дохода.'],
   ['§ 20 · ИТОГОВАЯ КАРТА ВЫВОДОВ','Перед финальным выводом я собираю всю историю в четыре индикатора: номинальный рост, реальную покупательную силу, гендерный разрыв и движение рабочей силы.','Вывод простой: зарплаты выросли, но рост распределен неравномерно; часть роста съедена ценами; рынок труда движется по-разному в разных отраслях.']
  ],
  conclusionTitle:'Заключение', conclusion:'Казахстанская зарплатная статистика — это не история “все стали богаче”. Это история о разрыве между номинальным ростом и реальной покупательной силой, между регионами, отраслями, мужчинами и женщинами. Поэтому смотреть нужно не только на среднюю зарплату, а на всю структуру рынка труда.',

  sections:[
   ['§ 01 · НЕГІЗГІ САНДАР','Орташа жалақы жалғыз өзі толық көрініс бермейді. Сондықтан медиана мен моданы қатар алып, типтік жұмысшының табысын бөлек көрсетемін.','Басты белгі: орташа жалақы көпшіліктің жалақысынан күшті көрінеді. Сондықтан әрі қарай тек өсімді емес, құрылымды қараймыз.'],
   ['§ 02 · ТЕҢГЕ ЖӘНЕ САТЫП АЛУ КҮШІ','Қызыл сызық — орташа төленген теңге. Көк сызық — сол жалақының 2007 жылғы бағамен құны. Екі сызық бір нүктеден басталады: 52 437 теңге.','Оқу тәсілі қарапайым: қызыл мен көк арасындағы алшақтық ұлғайған сайын, өсімнің көп бөлігі инфляция мен девальвацияға кеткен.'],
   ['§ 03 · ИНФЛЯЦИЯ ҚҰНЫ','Бұл блок инфляцияны қарапайым тілге аударады: өсімнің қай бөлігі сатып алу күшінде қалды, қай бөлігі баға өсіміне кетті.','Жылды таңдағанда номиналды өсім мен нақты әл-ауқаттың айырмасы көрінеді. 2025 жылы бұл алшақтық қайтадан айқын болды.'],
   ['§ 04 · 2025 ТОҚСАНДАР БОЙЫНША','Жылдық сызықтан кейін салалар бойынша тоқсандық қимаға өтемін. Мұнда жыл соңында қай жерде өсім күшейгені көрінеді.','Жылу картасында түс қоюлаған сайын жалақы жоғары. Қаржы, IT және тау-кен салалары барлық тоқсанда жоғарыда.'],
   ['§ 05 · САЛАЛЫҚ САТЫ','Ел бойынша орташа жалақы салалар арасындағы үлкен айырманы жасырады. Бір саты ең жоғары жалақыдан ең төмен жалақыға дейінгі аралықты көрсетеді.','Бір экономика, бірақ еңбек нарықтары бөлек: қаржы мен тау-кенде жалақы білім, өнер және қызмет көрсету салаларынан бірнеше есе жоғары.'],
   ['§ 06 · ӨҢІРЛІК КАРТА','Карта Қазақстандағы жалақы географиясын көрсетеді: қай өңірлер жоғары, қай өңірлер орташа деңгейден төмен екенін бірден көруге болады.','Батыс және ірі қалалар жалақы географиясының жоғарғы қабатын құрайды. Оңтүстік пен кейбір солтүстік өңірлер ортадан төмен.'],
   ['§ 07 · ҮШ ЖАЛАҚЫ','Орташа, медианалық және модалдық жалақы бірдей қозғалмайды. Орташа медианадан алшақтаса, үлестірім тең емес болады.','Нүктеге апарғанда көрінеді: “орташа жұмысшы” мен “орташа жалақы” бір нәрсе емес. Модалдық жалақы орташа жалақыдан әлдеқайда төмен.'],
   ['§ 08 · ГЕНДЕРЛІК АЛШАҚТЫҚ','Бұл жерде әйелдердің ерлерге қарағанда қаншалықты аз табатыны салалар бойынша көрсетілген.','Қаржы саласында әйелдер ерлерден шамамен 28% аз табады. Өнеркәсіп пен сервис салаларында да айырма анық көрінеді.'],
   ['§ 09 · НАҚТЫ ИНДЕКС','Әр баған жалақы инфляциядан озды ма, жоқ па екенін көрсетеді. 100-ден жоғары — нақты өсім, төмен — баға жалақыдан жылдам өсті.','Әлсіз кезеңдер — валюталық шоктардан кейінгі жылдар және 2025 жыл. Номиналды өсім бар, бірақ нақты индекс 100-ден төмен.'],
   ['§ 10 · 2025 ӨҢІРЛЕРІ','Картадан кейін өңірлерді бір шкалаға шығарамын: қайсысы елдік ортадан жоғары, қайсысы төмен.','Жекелеген өңірлердің елден қаншалықты озып кеткені анық көрінеді. Көшбасшылар бөлек жалақы белдеуін қалыптастырады.'],
   ['§ 11 · ЖҰМЫС КҮШІ ҚОЗҒАЛЫСЫ','Жалақы еңбек нарығының бір бөлігі ғана. Мұнда адамдар қозғалысын қараймын: қай салада қабылдау көп, қай салада кету көп.','Жасыл — таза өсім бар салалар. Қызыл — шығу қабылдаудан көп салалар. Бұл еңбек нарығының қысымын көрсетеді.'],
   ['§ 12 · ЕҢБЕК НАРЫҒЫНЫҢ ҚЫСЫМЫ','Қысым көрсеткіштері: толық емес жұмыс күні, бос тұру, қоса атқару, азаматтық-құқықтық шарттар және қашықтан жұмыс. Түстер күшейтілді.','Білім, мемлекеттік басқару және денсаулық сақтау стандартты емес жұмыспен қамтуда үлкен сандар береді. IT қашықтан жұмыспен ерекшеленеді.'],
   ['§ 13 · ҚАЛА ЖӘНЕ АУЫЛ','Келесі қима — салалардың ішкі айырмасы: бір сектор қала мен ауылда әртүрлі төлеуі мүмкін.','Көк оңға — қала жоғары. Қызыл солға — ауыл жоғары. Бұл салалардың ішкі айырмасын көрсетеді.'],
   ['§ 14 · МЕДИАНАНЫҢ ҮЛЕСІ','Бұл график медианалық жалақының орташаға қаншалықты жақын екенін көрсетеді. Үлес төмендесе, орташа көпшіліктің жағдайын нашар сипаттайды.','Медиананың орташаға қатынасы 100%-дан әлдеқайда төмен. Демек, жоғары жалақылар орташа көрсеткішті жоғары тартады.'],
   ['§ 15 · ГЕНДЕР УАҚЫТ БОЙЫНША','Салалардан кейін гендерлік айырманы уақыт бойынша қараймын: 2019 жылдан бергі медианалық жалақы.','Екі сызық та өседі, бірақ арақашықтық сақталады. Жалақының өсуі өздігінен алшақтықты жаппайды.'],
   ['§ 16 · НОМИНАЛДЫ ЖӘНЕ НАҚТЫ','Бұл жолақ жалақы бағадан озған жылдарды және инфляция күштірек болған жылдарды көрсетеді.','Қызыл жылдар — жалақы өсімі инфляциядан әлсіз болған кезеңдер. Бұл номиналды өсімнің нақты өсімге айналмағанын тез көрсетеді.'],
   ['§ 17 · ӨҢІРЛЕРДІҢ ҚҰБЫЛМАЛЫҒЫ','2025 жылы әр өңірдің өз тоқсандық дәлізі болды. Сызық минимум мен максимумды, нүкте IV тоқсанды көрсетеді.','Сызық неғұрлым ұзын болса, өңір жалақысы жыл ішінде соғұрлым қатты өзгерген. Бұл премия, маусымдық фактор, жұмыспен қамту құрылымы және ірі компаниялардың үлесімен байланысты болуы мүмкін.'],
   ['§ 18 · ЖАЛАҚЫ ҮЛЕСТІРІМІ','Мұнда бір саннан гөрі үлестірім формасы маңызды: қызметкерлердің негізгі бөлігі қай жерде екенін көруге болады.','Орташа сызық негізгі бағандардан оңға кетсе, типтік жалақы ресми орташа көрсеткіштен төмен екенін білдіреді.'],
   ['§ 19 · ЖИНАҚТАЛҒАН САТЫ','Мұнда негізгі элемент — көлденең жүгірткі. Жалақы шегін жылжытқанда сол жақта осы деңгейден төмен, оң жақта жоғары табатындардың үлесі көрінеді.','Егер үлкен үлес 300 мың теңгеге дейін жиналса, орташа жалақы “типтік” табыс сезімін асырып көрсетеді.'],
   ['§ 20 · ҚОРЫТЫНДЫ КАРТА','Финалға жақындағанда бүкіл талдауды төрт индикаторға жинаймын: номиналды өсім, нақты сатып алу күші, гендерлік айырма және жұмыс күші қозғалысы.','Қарапайым түйін: жалақы өсті, бірақ өсім тең бөлінбеді; бір бөлігі бағамен жойылды; еңбек нарығы салалар бойынша әртүрлі қозғалады.']
  ],
  conclusionTitle:'Қорытынды', conclusion:'Қазақстандағы жалақы статистикасы “бәрі байыды” деген әңгіме емес. Бұл номиналды өсім мен нақты сатып алу күші, өңірлер, салалар, ерлер мен әйелдер арасындағы айырма туралы оқиға. Сондықтан тек орташа жалақыға емес, еңбек нарығының толық құрылымына қарау керек.'

   ['§ 01 · KEY NUMBERS','I start with three measures because the average alone hides too much. Median and modal wages show how far the typical worker is from the headline number.','The signal is clear: the average looks stronger than what most workers receive. So the story must look at structure, not only growth.'],
   ['§ 02 · TENGE VS PURCHASING POWER','The red line is the average wage in tenge. The blue line is what that wage is worth in 2007 prices. Both start at the same point: 52,437 tenge.','Read it this way: the wider the gap between red and blue, the more wage growth was absorbed by inflation and devaluations.'],

   ['§ 04 · 2025 BY QUARTER','Now we move from an annual line to a quarterly sector view. All four quarters are included: Q4 bonuses and late-year jumps become visible.','The heatmap shows wage levels: darker means higher wages. Finance, IT and mining stay near the top across quarters.'],
   ['§ 05 · SECTOR LADDER','The national average hides huge differences between sectors. One ladder shows the full distance from the highest-paid sectors to the lowest-paid ones.','One economy, but very different labour markets: finance, IT and mining sit at the top, while education, arts and parts of services stay much lower.'],

   ['§ 08 · GENDER GAP','This view shows how much less women earn than men across sectors, not just the national average gap.','In finance, women earn about 28% less than men. Industry and service sectors also show visible gaps even when absolute wages differ.'],

   ['§ 10 · REGIONS 2025','After the map, I place regions on one scale to show who is above the national wage line and who remains below it.','It shows how far some regions are from the country as a whole. Leaders are not just above average; they form a separate wage belt.'],
   ['§ 11 · LABOUR MOVEMENT','Wages are only one side of the labour market. Here I look at worker flows: where hiring exceeded exits and where it did not.','Green means net inflow. Red means more people left than joined. It is another way to read labour-market pressure.'],
   ['§ 12 · LABOUR MARKET STRESS','Stress indicators include part-time work, downtime, side jobs, civil contracts and remote work. The colors are stronger for readability.','Education, public administration and healthcare produce large numbers for non-standard work. IT stands out for remote work.'],
   ['§ 13 · CITY AND VILLAGE','Next I look inside sectors: the same activity can pay differently in cities and rural areas.','Blue to the right means city wages are higher. Red to the left means rural wages are higher. This reveals variation inside sectors.'],
   ['§ 14 · MEDIAN SHARE','This chart asks how close the median wage is to the average. The lower the share, the less representative the average becomes.','The median-to-average ratio remains far below 100%. High wages continue to pull the average upward.'],
   ['§ 15 · GENDER OVER TIME','After sectors, I track the gender gap through time using median wages for men and women since 2019.','Both lines rise, but the distance remains. Wage growth alone does not close the gap.'],
   ['§ 16 · NOMINAL AND REAL','This strip shows years when wages beat prices and years when inflation was stronger than wage growth.','Red years are periods when wage growth was weaker than inflation. This quickly shows where nominal growth did not become real growth.'],
   ['§ 17 · REGIONAL VOLATILITY','Each region had its own quarterly corridor in 2025. The line shows min-max, the dot shows Q4.','The longer the line, the more the region’s wage level moved within the year. This can reflect bonuses, seasonality, employment structure and the role of large firms. A high average does not always mean stable dynamics.'],

   ['§ 20 · SUMMARY MAP','At the end, I bring the analysis into four indicators: nominal growth, real purchasing power, gender gap and labour movement.','The takeaway is simple: wages rose, but unevenly; part of the growth was eaten by prices; and labour-market movement differs sharply by sector.']

 <text x="30" y="172" font-size="14" fill="${C.faint}">${txt.w}</text><rect x="150" y="148" width="${wWomen}" height="48" fill="${C.red}"/><text x="${160+wWomen}" y="179" font-family="JetBrains Mono" font-size="13">${fmt(women)} ₸</text>
 <line x1="${150+wWomen}" x2="${150+wMen}" y1="236" y2="236" stroke="${C.gold}" stroke-width="8"/>
 <text x="${150+(wWomen+wMen)/2}" y="268" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="${C.gold}">−${gap}% ${txt.g}</text>`
}
function renderBarcode(){const vals=DATA.real.annual; let h='<div style="display:grid;grid-template-columns:repeat(19,1fr);gap:4px">'; DATA.avg.years.forEach((y,i)=>{let v=vals[i], col=v<100?C.red:(v>106?C.green:C.gold); h+=`<div title="${y}: ${v}%" style="height:${Math.max(30,Math.abs(v-100)*7+30)}px;background:${col};display:flex;align-items:end;justify-content:center;color:white;font-family:var(--mono);font-size:10px;padding-bottom:5px">${String(y).slice(2)}</div>`}); h+='</div><div class="mini" style="margin-top:10px">'+(lang==='en'?'Red = below 100, green = strong real growth':lang==='kz'?'Қызыл = 100-ден төмен, жасыл = күшті нақты өсім':'Красный = ниже 100, зеленый = сильный реальный рост')+'</div>'; document.getElementById('barcode').innerHTML=h}
function renderVolatility(){const svg=document.getElementById('volatility'); svg.innerHTML=''; let rows=DATA.regions.slice().map(d=>({...d,min:Math.min(...d.q),max:Math.max(...d.q),q4:d.q[3],range:Math.max(...d.q)-Math.min(...d.q)})).sort((a,b)=>b.range-a.range); const maxv=Math.max(...rows.map(d=>d.max)), minv=Math.min(...rows.map(d=>d.min)); const x=v=>180+(v-minv)/(maxv-minv)*650; rows.forEach((d,i)=>{let y=42+i*24; svg.innerHTML+=`<text x="165" y="${y+4}" text-anchor="end" font-size="12" fill="${C.faint}">${regName(d)}</text><line x1="${x(d.min)}" x2="${x(d.max)}" y1="${y}" y2="${y}" stroke="${C.rule}" stroke-width="8"/><circle cx="${x(d.q4)}" cy="${y}" r="5" fill="${C.red}"/><text x="${x(d.max)+8}" y="${y+4}" font-family="JetBrains Mono" font-size="10" fill="${C.faint}">${kt(d.range)}</text>`})}
function renderHist(){const box=document.getElementById('hist'); const max=Math.max(...DATA.wageDist.map(d=>d.pct)); let h=''; DATA.wageDist.forEach(d=>{h+=`<div class="hist-bar" style="height:${d.pct/max*240}px">${d.pct}%<div class="hist-label">${d[lang]}</div></div>`}); const pos={mode:2.25,median:3.35,mean:4.55}; h+=Object.entries(pos).map(([k,p])=>`<div style="position:absolute;left:calc(48px + ${p} * ((100% - 80px)/6));bottom:38px;height:250px;border-left:3px solid ${k==='mode'?C.gold:k==='median'?C.blue:C.red}"><span style="position:absolute;top:-22px;left:-28px;font-family:var(--mono);font-size:10px;color:${k==='mode'?C.gold:k==='median'?C.blue:C.red}">${L(k)}</span></div>`).join(''); box.innerHTML=h}
function cumLabel(i){return DATA.distCum[i][lang]}
function updateCumSlider(i){
 i=Number(i); const d=DATA.distCum[i]; const below=d.cum; const above=100-below;
 const box=document.getElementById('cumSliderBox'); if(!box)return;
 const fill=box.querySelector('#cumFill'), left=box.querySelector('#cumBelow'), right=box.querySelector('#cumAbove'), thr=box.querySelector('#cumThreshold'), caption=box.querySelector('#cumCaption');
 if(fill)fill.style.width=below+'%';
 if(left)left.textContent=below+'%';
 if(right)right.textContent=above+'%';
 if(thr)thr.textContent=cumLabel(i);
 if(caption)caption.textContent=(lang==='en'?`${below}% earn less than this band, ${above}% earn more.`:lang==='kz'?`${below}% осы деңгейден төмен, ${above}% жоғары табады.`:`${below}% работников получают меньше этого уровня, ${above}% — больше.`);
}
function renderCumDist(){
 const box=document.getElementById('cumSliderBox'); if(!box)return;
 box.innerHTML=`
  <div class="mini-note">${lang==='en'?'Move the threshold: the split shows how many workers are below and above it.':lang==='kz'?'Порогты жылжытыңыз: төмен және жоғары табатындардың үлесі бірден көрінеді.':'Двигайте порог: сразу видно, какая доля работников ниже и выше выбранного уровня.'}</div>
  <div style="display:flex;justify-content:space-between;gap:10px;align-items:end;margin-top:14px"><div><div class="mini">${lang==='en'?'Wage threshold':lang==='kz'?'Жалақы шегі':'Порог зарплаты'}</div><div id="cumThreshold" style="font-family:var(--sans);font-size:30px;font-weight:800;letter-spacing:-.04em"></div></div><div id="cumCaption" class="mini-note" style="max-width:430px;text-align:right"></div></div>
  <input class="cum-slider" type="range" min="0" max="5" step="1" value="3" oninput="updateCumSlider(this.value)">
  <div style="height:30px;background:#efe3d1;border:1px solid var(--rule);position:relative;overflow:hidden"><div id="cumFill" style="height:100%;background:var(--red);width:0%"></div><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:#261a10">${lang==='en'?'share below threshold':lang==='kz'?'шектен төмен үлес':'доля ниже порога'}</div></div>
  <div class="cum-readout"><div class="cum-box left"><div class="mini">${lang==='en'?'earn less':lang==='kz'?'төмен табады':'зарабатывают меньше'}</div><div class="big" id="cumBelow"></div></div><div class="cum-box right"><div class="mini">${lang==='en'?'earn more':lang==='kz'?'жоғары табады':'зарабатывают больше'}</div><div class="big" id="cumAbove"></div></div></div>
  <div class="legend-row">${DATA.distCum.map((d,i)=>`<span class="pill">${d[lang]} · ${d.cum}%</span>`).join('')}</div>`;
 updateCumSlider(3);
}
function renderSummaryMap(){const svg=document.getElementById('summaryMap'); svg.innerHTML=''; const items=[['×'+(DATA.avg.annual.at(-1)/DATA.avg.annual[0]).toFixed(1),lang==='en'?'nominal wage growth':lang==='kz'?'номиналды өсім':'номинальный рост',C.red],[(DATA.real.cum.at(-1)).toFixed(0)+'%',lang==='en'?'real purchasing index':lang==='kz'?'нақты сатып алу':'реальная покупательная сила',C.blue],['−'+Math.round((1-DATA.median.women.at(-1)/DATA.median.men.at(-1))*100)+'%',lang==='en'?'median gender gap':lang==='kz'?'гендерлік алшақтық':'гендерный разрыв',C.purple],['+'+fmt(DATA.topNet[0].net),lang==='en'?'largest net inflow':lang==='kz'?'ең үлкен таза өсім':'самый большой чистый приток',C.green]]; items.forEach((it,i)=>{let x=70+(i%2)*270,y=70+Math.floor(i/2)*170; svg.innerHTML+=`<circle cx="${x}" cy="${y}" r="54" fill="${it[2]}" opacity=".16"/><text x="${x}" y="${y+4}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="26" fill="${it[2]}">${it[0]}</text><text x="${x}" y="${y+82}" text-anchor="middle" font-size="13" fill="${C.faint}">${it[1]}</text>`})}
function renderAll(){killCharts(); translateStatic(); buildStory(); renderKPIs(); chart2(); renderWedge(2025); renderHeat(); renderIndustry('all'); renderHex(); renderThreeWages(); renderGenderGap(); chart9(); renderRegionsRank(); renderMovement(); renderStress(); renderUrbanRural(); chart14(); chart15(2025); renderBarcode(); renderVolatility(); renderHist(); renderCumDist(); renderSummaryMap()}
renderAll();
</script>
