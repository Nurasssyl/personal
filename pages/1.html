<!DOCTYPE html>
<html>
<head>
  <title>Protected Areas in Kazakhstan</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 90vh; background: white; }
    h1 { text-align: center; font-family: Arial, sans-serif; margin: 10px 0; }
  </style>
</head>
<body>
<h1>Protected Areas in Kazakhstan</h1>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script>
  var map = L.map('map').setView([47, 67], 5);

  axios.get('kazakhstan_border.geojson').then(function(response) {
    L.geoJSON(response.data, {
      style: { color: 'black', weight: 2, fillColor: 'yellow', fillOpacity: 0.3 }
    }).addTo(map);
  });

  axios.get('protected_all.geojson').then(function(response) {
    L.geoJSON(response.data, {
      style: { color: '#444', weight: 1, fillColor: '#0074D9', fillOpacity: 0.5 },
      onEachFeature: function (feature, layer) {
        var name = feature.properties.NAME_EN || feature.properties.NAME || 'Unnamed';

        layer.bindTooltip(name, { sticky: true, direction: 'top', permanent: false, opacity: 0.9 });

        layer.on('mouseover', function() {
          this.setStyle({ color: 'yellow', weight: 2 });
        });
        layer.on('mouseout', function() {
          this.setStyle({ color: '#444', weight: 1 });
        });
      }
    }).addTo(map);
  });
</script>
</body>
</html>
