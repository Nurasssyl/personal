<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Taxation Agreement Map</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; }
        h1 { color: #2E86C1; }
        svg { display: block; margin: auto; }
        .country { stroke: #ffffff; stroke-width: 0.5px; }
        .highlight { fill: #2E86C1 !important; }
        .kazakhstan { fill: #F39C12 !important; } /* Different color for Kazakhstan */
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
            pointer-events: none;
        }
        #message { font-size: 18px; color: #C0392B; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Countries with a Double Taxation Agreement with Kazakhstan</h1>
    <p>If your country is highlighted in blue, you may be eligible to avoid double taxation.</p>
    <div class="tooltip"></div>
    <div id="message"></div>
    <script>
        const width = 960, height = 500;
        const projection = d3.geoNaturalEarth1().scale(150).translate([width / 2, height / 2]);
        const path = d3.geoPath().projection(projection);
        const svg = d3.select("body").append("svg").attr("width", width).attr("height", height);
        const tooltip = d3.select(".tooltip");
        const messageBox = d3.select("#message");

        const taxTreatyCountries = new Set([
            "United Kingdom", "Italy", "Canada", "United States of America", "Netherlands", "Germany", "Pakistan",
            "Poland", "Turkey", "Hungary", "Ukraine", "India", "Lithuania", "Azerbaijan", "Belarus",
            "Russia", "Uzbekistan", "Sweden", "Bulgaria", "Kyrgyzstan", "Iran", "South Korea", "Czechia",
            "Mongolia", "Belgium", "Turkmenistan", "Romania", "France", "Georgia", "Estonia", "Tajikistan",
            "Switzerland", "Moldova", "Latvia", "China", "Norway", "Austria", "Singapore", "Slovakia",
            "Japan", "Malaysia", "Armenia", "Finland", "Spain", "United Arab Emirates", "Luxembourg", "Qatar",
            "Macedonia", "Vietnam", "Saudi Arabia", "Slovenia", "Serbia", "Ireland"
        ]);
        
        const kazakhstan = "Kazakhstan"; // Highlight Kazakhstan separately

        d3.json("https://unpkg.com/world-atlas@2/countries-110m.json").then(data => {
            const countries = topojson.feature(data, data.objects.countries).features;

            svg.selectAll("path")
                .data(countries)
                .enter().append("path")
                .attr("class", d => d.properties.name === kazakhstan ? "kazakhstan" : "country")
                .attr("fill", d => d.properties.name === kazakhstan ? "#F39C12" :
                                    (taxTreatyCountries.has(d.properties.name) ? "#2E86C1" : "#CCCCCC"))
                .attr("d", path)
                .on("mouseover", (event, d) => {
                    tooltip.style("display", "block").text(d.properties.name);
                    d3.select(event.target).attr("fill", d.properties.name === kazakhstan ? "#D68910" : "#1B4F72");
                    
                    if (d.properties.name !== kazakhstan && !taxTreatyCountries.has(d.properties.name)) {
                        messageBox.text(`Your country (${d.properties.name}) is NOT on the list. You may be subject to double taxation.`);
                    } else {
                        messageBox.text("");
                    }
                })
                .on("mousemove", event => {
                    tooltip.style("top", (event.pageY - 10) + "px")
                           .style("left", (event.pageX + 10) + "px");
                })
                .on("mouseout", (event, d) => {
                    tooltip.style("display", "none");
                    d3.select(event.target).attr("fill", d.properties.name === kazakhstan ? "#F39C12" :
                        (taxTreatyCountries.has(d.properties.name) ? "#2E86C1" : "#CCCCCC"));
                    messageBox.text("");
                });
        });
    </script>
</body>
</html>
