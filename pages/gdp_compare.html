// Получаем ранги по убыванию ВВП
const sortedCountries = Object.entries(gdpData)
  .sort((a, b) => b[1] - a[1])
  .map((entry, i) => ({ name: entry[0], rank: i + 1 }));
const gdpRanks = Object.fromEntries(sortedCountries.map(d => [d.name, d.rank]));

const colorScale = (country) => {
  const gdp = gdpData[country];
  if (gdp === undefined) return '#ccc';
  if (country === "Kazakhstan") return '#FFD700';
  return gdp > kazakhstanGDP ? '#1f77b4' : '#d62728';
};

const svg = d3.select("svg");
const projection = d3.geoNaturalEarth1();
const path = d3.geoPath().projection(projection);
const tooltip = d3.select("#tooltip");

Promise.all([
  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
]).then(([worldData]) => {
  const countries = topojson.feature(worldData, worldData.objects.countries);

  d3.json("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson").then(function(geoData) {
    svg.append("g")
      .selectAll("path")
      .data(geoData.features)
      .join("path")
      .attr("d", path)
      .attr("fill", d => colorScale(d.properties.name))
      .attr("stroke", "#333")
      .attr("stroke-width", 0.3)
      .on("mouseover", function(event, d) {
        const name = d.properties.name;
        const gdp = gdpData[name];
        const rank = gdpRanks[name];
        if (gdp !== undefined) {
          const ratio = gdp > kazakhstanGDP
            ? (gdp / kazakhstanGDP).toFixed(1) + " more than Kazakhstan"
            : (kazakhstanGDP / gdp).toFixed(1) + " less than Kazakhstan";
          tooltip.style("opacity", 1)
                 .html(`<strong>${name}</strong><br>GDP: $${gdp}B<br>${ratio}<br>Rank: #${rank}`);

          tooltip.style("opacity", 1)
                 .html(`<strong>${name}</strong><br>GDP: unknown`);
        }
      })
      .on("mousemove", function(event) {
