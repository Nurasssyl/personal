<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Structure of Almaty Buildings</title>

<!-- OpenSeadragon -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.0.0/openseadragon.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.0.0/openseadragon.min.css" />

<style>
    body {
        margin: 0;
        background-color: #000;
        font-family: Arial, sans-serif;
    }
    #almaty-viewer {
        width: 100vw;
        height: 100vh;
        background-color: #000;
    }
    /* Легенда */
    .legend {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.5;
        backdrop-filter: blur(4px);
    }
    .legend-title {
        font-weight: bold;
        margin-bottom: 6px;
        font-size: 18px;
    }
</style>
</head>
<body>

<div id="almaty-viewer"></div>

<div class="legend">
    <div class="legend-title">Heights of Buildings</div>
    • 0–3 m 💙<br>
    • 3–6 m 💚<br>
    • 6–9 m 💛<br>
    • 9–12 m 🧡<br>
    • >12 m ❤️
</div>

<script>
    OpenSeadragon({
        id: "almaty-viewer",
        prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.0.0/images/",
        tileSources: {
            type: 'image',
            url: '../assets/images/almaty_heights_hd.png'
        },
        showNavigator: true,
        animationTime: 0.8,
        zoomPerScroll: 1.2,
        defaultZoomLevel: 1,
        minZoomLevel: 1,
        maxZoomLevel: 20
    });
</script>

</body>
</html>
