<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 50px 20px;
        }
        header img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
        }
        header h1 {
            font-size: 2.5em;
            margin: 20px 0 10px;
        }
        header p {
            font-size: 1.2em;
            margin: 0;
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 10px 0;
            z-index: 1000;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: 700;
        }
        nav ul li a:hover {
            color: #007BFF;
        }
        .portfolio {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 50px 0;
        }
        .portfolio-item {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .portfolio-item:hover {
            transform: scale(1.05);
        }
        .portfolio-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .portfolio-item p {
            padding: 15px;
            margin: 0;
        }
        .skills {
            margin: 50px 0;
        }
        .skills h2 {
            text-align: center;
        }
        .skills ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .skills ul li {
            margin: 10px 20px;
            font-size: 1.1em;
            color: #007BFF;
        }
        .contact {
            text-align: center;
            margin: 50px 0;
        }
        .contact a {
            color: #007BFF;
            text-decoration: none;
            font-size: 1.2em;
        }
        .contact a:hover {
            text-decoration: underline;
        }
        .resume {
            text-align: center;
            margin: 20px 0;
        }
        .resume a {
            text-decoration: none;
            color: #fff;
            background-color: #007BFF;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .resume a:hover {
            background-color: #0056b3;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.5s;
        }
        .modal img {
            max-width: 100%;
            height: auto;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5em;
            color: #fff;
            cursor: pointer;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<nav>
    <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<div class="container">
    <header id="about">
        <img src="your-photo.jpg" alt="Your Photo">
        <h1>Your Name</h1>
        <p>Short bio about you, your skills, and what you do.</p>
    </header>

    <section class="skills">
        <h2>Skills</h2>
        <ul>
            <li>Skill 1</li>
            <li>Skill 2</li>
            <li>Skill 3</li>
            <li>Skill 4</li>
        </ul>
    </section>

    <section class="portfolio" id="portfolio">
        <div class="portfolio-item" onclick="openModal('project1.jpg', 'Project 1 Description')">
            <img src="project1.jpg" alt="Project 1">
            <p>Project 1</p>
        </div>
        <div class="portfolio-item" onclick="openModal('project2.jpg', 'Project 2 Description')">
            <img src="project2.jpg" alt="Project 2">
            <p>Project 2</p>
        </div>
        <!-- Add more projects as needed -->
    </section>

    <section class="resume">
        <a href="resume.pdf" target="_blank">Download Resume</a>
    </section>

    <section class="contact" id="contact">
        <p>Email: <a href="mailto:your-email@example.com">your-email@example.com</a></p>
        <p>LinkedIn: <a href="https://linkedin.com/in/yourprofile" target="_blank">Your LinkedIn</a></p>
    </section>
</div>

<div class="modal" id="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="modal-content">
        <img id="modal-image" src="" alt="">
        <p id="modal-description"></p>
    </div>
</div>

<script>
    function openModal(image, description) {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('modal-image').src = image;
        document.getElementById('modal-description').textContent = description;
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }
</script>

</body>
</html>
