<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <title>Bubble Chart with Side Legend</title>
  <style>
    body {
      display: flex;
      margin: 0;
      font-family: sans-serif;
    }
    #legend {
      width: 200px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background-color: #f9f9f9;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .legend-color {
      width: 15px;
      height: 15px;
      margin-right: 10px;
      border-radius: 50%;
    }
    #chart {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <div id="legend"></div>
  <div id="chart"></div>
  <script>
    d3.csv("data.csv").then(data => {
      data.forEach(d => {
        d.value = +d.value; // Преобразуем числовое значение
      });

      const width = 800;
      const height = 800;

      // Уникальные группы
      const groups = [...new Set(data.map(d => d.group))];

      // Уникальная палитра цветов для групп
      const uniqueColors = d3.schemeSet3.concat(d3.schemeCategory10); // Расширенная палитра
      if (groups.length > uniqueColors.length) {
        alert("Недостаточно цветов для всех групп!");
        return;
      }

      const color = d3.scaleOrdinal()
        .domain(groups)
        .range(uniqueColors.slice(0, groups.length)); // Гарантируем уникальные цвета

      const pack = d3.pack()
        .size([width, height])
        .padding(5);

      const hierarchy = d3.hierarchy({ children: data })
        .sum(d => d.value)
        .sort((a, b) => b.value - a.value); // Сортировка пузырей по размеру

      const root = pack(hierarchy);

      const svg = d3.create("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height])
        .attr("style", "background: #fff;");

      const node = svg.selectAll("g")
        .data(root.leaves())
        .join("g")
          .attr("transform", d => `translate(${d.x},${d.y})`);

      node.append("circle")
        .attr("r", d => d.r)
        .attr("fill", d => color(d.data.group)) // Цвет по группе
        .attr("stroke", "#fff")
        .attr("stroke-width", 1);

      node.append("text")
        .attr("text-anchor", "middle")
        .attr("dy", "0.3em")
        .attr("font-size", d => Math.min(d.r / 3, 12))
        .text(d => d.data.name);

      document.getElementById("chart").appendChild(svg.node());

      // Добавляем легенду сбоку
      const legend = d3.select("#legend");
      groups.forEach(group => {
        const legendItem = legend.append("div").attr("class", "legend-item");
        legendItem.append("div")
          .attr("class", "legend-color")
          .style("background-color", color(group));
        legendItem.append("span").text(group);
      });
    }).catch(error => {
      console.error("Error loading the CSV file:", error);
    });
  </script>
</body>
</html>
