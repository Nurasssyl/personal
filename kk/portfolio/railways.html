<!DOCTYPE html>
<html>
<head>
    <title>Railway Routes Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
        // Инициализация карты с белым фоном
        var map = L.map('map').setView([48.0196, 66.9237], 5);

        // Добавление белого слоя
        L.tileLayer('', {
            maxZoom: 18,
            attribution: ''
        }).addTo(map);

        // Загрузка GeoJSON с границами Казахстана
        var geoJsonUrl = 'https://raw.githubusercontent.com/Nurasssyl/personal/main/kk/portfolio/geoBoundaries-KAZ-ADM1.geojson';

        fetch(geoJsonUrl)
            .then(response => response.json())
            .then(data => {
                // Добавляем границы Казахстана на карту
                L.geoJSON(data, {
                    style: {
                        color: "#000",
                        weight: 2,
                        fillColor: "#f5f5f5",
                        fillOpacity: 1
                    }
                }).addTo(map);

                // Путь к вашему CSV-файлу с данными ЖД
                var csvFilePath = 'https://raw.githubusercontent.com/Nurasssyl/personal/main/kk/portfolio/railway_csv.csv';

                // Список цветов для маршрутов
                var routeColors = ["red", "blue", "green", "orange", "purple", "brown", "pink", "yellow"];

                // Загрузка CSV-файла
                Papa.parse(csvFilePath, {
                    download: true,
                    header: true,
                    complete: function(results) {
                        var data = results.data;
                        var routes = {};

                        // Группируем данные по маршрутам
                        data.forEach(function(row) {
                            var routeId = row.Route_ID;
                            if (!routes[routeId]) {
                                routes[routeId] = {
                                    name: row.Route_Name,
                                    stations: [],
                                    color: routeColors[Object.keys(routes).length % routeColors.length] // Назначаем цвет
                                };
                            }
                            routes[routeId].stations.push({
                                name: row.Station_Name,
                                coordinates: row.Coordinates.split(',').map(Number),
                                country: row.Country
                            });
                        });

                        // Визуализация маршрутов
                        Object.values(routes).forEach(function(route) {
                            var latlngs = [];

                            route.stations.forEach(function(station) {
                                // Добавляем маркеры станций
                                L.marker(station.coordinates)
                                    .addTo(map)
                                    .bindPopup(`<b>${station.name}</b><br>${station.country}`);

                                // Собираем координаты для линии маршрута
                                latlngs.push(station.coordinates);
                            });

                            // Рисуем линию маршрута поверх границ
                            L.polyline(latlngs, { color: route.color, weight: 4 }).addTo(map)
                                .bindPopup(`<b>Route:</b> ${route.name}`);
                        });
                    }
                });
            })
            .catch(error => console.error('Ошибка загрузки GeoJSON:', error));
    </script>
</body>
</html>
